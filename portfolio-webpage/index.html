<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curl Cafe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="curl cafe logo.png" alt="logo" class="logo">
        <h1>Curl Cafe</h1>


        <menu>
            <ul>
                <li><button onclick="copy()">All About Us</button></li>
                <li><button onclick="copy()">Hair Care Tips</button></li>
                <li><button onclick="copy()">Hair Types and Porosity</button></li>
                <li><button onclick="copy()">DIY Recipes</button></li>
                <li><button onclick="copy()">Tutorials</button></li>
                <li><button onclick="copy()">Blog</button></li>
                <li><button onclick="copy()">Contact Us</button></li>
            </ul>

        </menu>
        </header>
        <main>
            <video controls autoplay loop width="100%">
                <source src="h1 video.mp4" type="video/mp4">
                your browser doesn't support HTML video. 
                <a href="h1 video.mp4">link to the video </a> 


        </video>
        </main>

    <div class="box-container">
        <div class="box ">
        <h3> Hair Type/Porosity Quiz </h3>
        <img src="Hair type quiz.png" alt="hair quiz image" class="box-img">
        </div>
        <div class="box">
        <h3>DIY RECIPES</h3>
        <img src="DIY RECIPES.png" alt="DIY recipe image" class="box-img">
    </div>

    <div class="contact-form-container">
        <h4> A problem shared is a problem halved...if you have any questions ask away!</h4>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" required>
    
            </div>
            <div class="form-group">
                <label for="email" class="email-label">Email:</label>
                <input type="email" id="email" name="email" required>

            </div>
            <div class="form-group">
                <label for="phone" class="phone-label">Phone:</label>
                <input type="tel" id="phone" name="phone">

            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5"></textarea>

            </div>
            <button type="submit">Submit</button>


        </form>

        
      
    

    </div>
        

    
    

    <section class="Mantra">
        <article>
            <h2>NOURISH.</h2>
    
        </article>
        <article>
            <h2>LOVE.</h2>
            
        </article>
        <article>
            <h2>REPEAT.</h2>
        
        </article>
   </section>

    



  

    
</body>
<footer>Loving your curls is a journey. We're here every step of the way | © 2025 Curl Cafe. All Rights Reserved.</footer>
</html>
